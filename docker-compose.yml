# Local development stack. Credentials below are dev-only defaults, not secrets.
name: mollookup

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mollookup
      POSTGRES_PASSWORD: mollookup
      POSTGRES_DB: mollookup
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mollookup -d mollookup"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgres://mollookup:mollookup@postgres:5432/mollookup
      REDIS_URL: redis://redis:6379
      # CACHE_ONLY=true is for k6 load tests: a full miss returns 503 instead of calling PubChem.
      CACHE_ONLY: ${CACHE_ONLY:-false}
      PUBCHEM_RPS: 4
      PUBCHEM_USER_AGENT: ${PUBCHEM_USER_AGENT:-MolLookUp/0.1 (portfolio project)}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
    ports: ["3001:3001"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:3001
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on: [api]

volumes:
  pgdata:
  web_node_modules:
